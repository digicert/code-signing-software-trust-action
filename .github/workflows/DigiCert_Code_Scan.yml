name: DigiCert One Time Code Scan Action (Stage)

on:
  workflow_dispatch:

jobs:
  scan:
    name: CodeQL + SBOM
    runs-on: ubuntu-latest

    # CodeQL + trivy + upload-artifact need these.
    permissions:
      contents: read
      actions: read
      security-events: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: DigiCert One Time Code Scan Action Stage
        uses: digicert/digicert-code-monitoring-action@master
        with:
          region: gp2-stage
          env: stage
          api-key: ${{ secrets.DIGICERT_BACKEND_API_KEY }}